<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
       font-size: 0.6875rem; text-align: center; 
       position: fixed;
       bottom: 0;
       left: 0;
       width: 100%;
       padding: 16px;
      }
    .attribution a { 
      color: hsl(228, 45%, 44%); 
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #141414;
      font-family: 'Sora', sans-serif;
    }

    .card {
      background: #1f1f1f;
      border-radius: 16px;
      padding: 40px 32px;
      width: 320px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 16px;
      display: block;
      border: 3px solid #2e2e2e;
    }

    .name {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .location {
      font-size: 0.8rem;
      font-weight: 600;
      color: #dff800;
      margin-bottom: 14px;
      letter-spacing: 0.03em;
    }

    .bio {
      font-size: 0.82rem;
      color: #aaaaaa;
      margin-bottom: 28px;
      font-style: italic;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: block;
      width: 100%;
      padding: 13px;
      background: #2e2e2e;
      color: #ffffff;
      font-family: 'Sora', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
    }

    .link-btn:hover {
      background: #3d3d3d;
      transform: translateY(-2px);
    }

    .link-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
<div class="card">
    <img
      class="avatar"
      src="assets\images\avatar-jessica.jpeg"
      alt="Jessica Randall"
    />
    <p class="name">Jessica Randall</p>
    <p class="location">London, United Kingdom</p>
    <p class="bio">"Front-end developer and avid reader."</p>

    <div class="links">
      <a class="link-btn" href="https://github.com/Agbenyefia600">GitHub</a>
      <a class="link-btn" href="https://www.frontendmentor.io">Frontend Mentor</a>
      <a class="link-btn" href="https://www.linkedin.com/in/jessica-randall">LinkedIn</a>
      <a class="link-btn" href="https://twitter.com/jessica_randall">Twitter</a>
      <a class="link-btn" href="https://www.instagram.com/">Instagram</a>
    </div>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Agbenyefia600">Godswill Agbenyefia Vittor</a>.
  </footer>
  
</body>
</html>
